<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250" role="img" aria-labelledby="title desc">
<title id="title">Left hand on keys 1, 2, 3 and 4</title><desc id="desc">Rest your little, ring, middle and index fingers on the four highlighted number keys. Your thumb can reach Space to pause.</desc>
